<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>一箭又一箭</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1 id="title">一箭又一箭</h1>
        <div id="hud">
            <span id="level-name">第 1 关</span>
            <span id="hearts">❤❤❤</span>
        </div>
        <canvas id="board"></canvas>
        <div id="controls">
            <button id="restart-btn">重新开始</button>
            <button id="endless-btn">无尽模式</button>
        </div>
        <p id="message"></p>
    </div>
    <script src="game.js"></script>
</body>
</html>
